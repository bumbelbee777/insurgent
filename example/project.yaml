project: insurgent-example
description: An example project demonstrating InsurgeNT's build system.
authors: ["John Desktop"]
license: MIT
version: 0.1.0
language: c++
standard: c++20
compiler: clang++
compiler_flags:
  - global: "-fPIC"
  - common: "-O2 -Wall -Wextra"
  - cpp: "-std=c++20"
  - ld: "-lstdc++"
project_dirs: ["sources"]
project_type: executable
output: binaries/insurgent-example

# Optional bootstrap configuration
bootstrap:
  - task: prepare
  - command: "mkdir -p binaries"