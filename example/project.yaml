project: insurgent-example
description: An example project demonstrating InsurgeNT's build system.
authors: ["John Desktop"]
license: MIT
version: 0.1.0
language: c++
standard: c++20
compiler: g++
compiler_flags:
  - global: "-fPIC"
  - common: "-O2 -Wall -Wextra"
  - cpp: "-std=c++20"
  - ld: "-lstdc++"
project_dirs: ["sources"]
project_type: executable
output: binaries/insurgent-example

# Ensure output directory exists on all platforms (Windows cmd has no `mkdir -p`).
bootstrap:
  - task: prepare
  - command: python -c "import pathlib; pathlib.Path('binaries').mkdir(parents=True, exist_ok=True)"

# Native harness: `insurgent test` / `test` in the InsurgeNT shell.
unit_tests:
  project_dirs: ["tests"]
  output: binaries/run_tests